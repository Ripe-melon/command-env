services:
  ejbca-database:
    container_name: ejbca-database
    image: mariadb:latest
    restart: unless-stopped
    networks: [application-bridge]
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=ejbca
      - MARIADB_USER=ejbca
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - ejbca-db:/var/lib/mysql

  ejbca:
    container_name: ejbca
    hostname: mac-lab
    image: keyfactor/ejbca-ce:latest
    restart: unless-stopped
    depends_on: [ejbca-database]
    networks: [access-bridge, application-bridge]
    environment:
      - DATABASE_JDBC_URL=jdbc:mariadb://ejbca-database:3306/ejbca?characterEncoding=UTF-8
      - DATABASE_USER=ejbca
      - DATABASE_PASSWORD=${MARIADB_PASSWORD}
      - LOG_LEVEL_APP=INFO
      - LOG_LEVEL_SERVER=INFO
      - TLS_SETUP_ENABLED=simple
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"

networks:
  access-bridge:
  application-bridge:

volumes:
  ejbca-db: