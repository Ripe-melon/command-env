services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    restart: unless-stopped
    command: ["start"]
    ports:
      - "1443:8443"
    environment:
      KC_HOSTNAME: https://mac-lab.tail38eafb.ts.net:1443
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls.key
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: mssql
      KC_DB_URL_HOST: vm-command-01.tail38eafb.ts.net
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_URL_PROPERTIES: ";encrypt=true;trustServerCertificate=false;trustStore=/opt/keycloak/conf/sql-truststore;trustStorePassword=${TRUSTSTORE_PASSWORD};"
      KC_TRANSACTION_XA_ENABLED: "false"
    volumes:
      - ./certs/tls.crt:/opt/keycloak/conf/tls.crt:ro
      - ./certs/tls.key:/opt/keycloak/conf/tls.key:ro
      - ./certs/sql-truststore:/opt/keycloak/conf/sql-truststore:ro